[project]
name = "drawio-export-mcp"
version = "1.0.0"
description = "Draw.io Export MCP Server - exports .drawio files via remote Export Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
drawio-export-mcp = "drawio_export_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawio_export_mcp"]
